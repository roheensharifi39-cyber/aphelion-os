name: Release Windows app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Use canonical Windows temporary paths
        shell: pwsh
        run: |
          $canonicalTemp = node -e "console.log(require('node:fs').realpathSync.native(require('node:os').tmpdir()))"
          "TEMP=$canonicalTemp" >> $env:GITHUB_ENV
          "TMP=$canonicalTemp" >> $env:GITHUB_ENV
      - name: Assign increasing release version
        shell: pwsh
        run: |
          $base = (Get-Content package.json | ConvertFrom-Json).version.Split('.')
          $version = "$($base[0]).$($base[1]).$env:GITHUB_RUN_NUMBER"
          npm version $version --no-git-tag-version --allow-same-version
          "APP_VERSION=$version" >> $env:GITHUB_ENV
      - run: npm run check
      - run: npm run package
      - name: Publish verified Windows update
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          $assets = @("release/Aphelion-OS-$env:APP_VERSION-setup.exe", "release/Aphelion-OS-$env:APP_VERSION-setup.exe.blockmap", 'release/latest.yml')
          foreach ($asset in $assets) { if (!(Test-Path -LiteralPath $asset)) { throw "Missing update artifact: $asset" } }
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Aphelion OS $env:APP_VERSION" --notes "Automatic Windows build from commit $env:GITHUB_SHA. Updates install when Aphelion closes." --latest
          } else {
            gh release upload $tag @assets --repo $env:GITHUB_REPOSITORY --clobber
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
